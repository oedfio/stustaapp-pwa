<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <clipPath id="roundedSquare">
      <rect x="6" y="6" width="180" height="180" rx="34" ry="34"/>
    </clipPath>
  </defs>

  <rect x="6" y="6" width="180" height="180" rx="34" ry="34" fill="#ffffff" stroke="#1a1a1a" stroke-width="7"/>

  <g clip-path="url(#roundedSquare)">
    <g transform="translate(96,96) skewX(-16) translate(-96,-96)">
      <rect x="15"  y="0" width="36" height="192" fill="#e8cc4f"/>
      <rect x="57"  y="0" width="36" height="192" fill="#d75f3d"/>
      <rect x="99"  y="0" width="36" height="192" fill="#6ba852"/>
      <rect x="141" y="0" width="36" height="192" fill="#5789bd"/>
    </g>
  </g>

  <rect x="6" y="6" width="180" height="180" rx="34" ry="34" fill="none" stroke="#1a1a1a" stroke-width="7"/>
</svg>
